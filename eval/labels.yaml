# Ground-truth labels for the extraction eval (Plan 2b).
#
# Transcribed by hand from the source PDFs, independent of any extractor output, so the eval
# does not grade itself. Values are CANONICAL (the form the pipeline normalizes to):
#   revenue_quarterly / arr / cash_balance / net_burn_monthly / ebitda  -> USD millions
#   gross_margin / net_revenue_retention / gross_revenue_retention / logo_churn -> percent
#   headcount -> count
# Currency is the native reporting currency (values are NOT FX-converted).
#
# status:
#   present         - reported in this document; `value` is the canonical figure
#   null_in_source  - the metric could apply to this company but is not reported here
#   not_applicable  - the metric is meaningless for this business model (e.g. ARR for a lender)
#
# Notes capture basis/ambiguity for the human reviewer; they are intentionally free text, not
# enum strings, so this file does not churn when the record schema firms up in 2c/2d.

