    cash_balance:            {value: 19.6, label_as_reported: "Cash Balance", page: 1, status: present}
    net_burn_monthly:        {value: 0.75, label_as_reported: "Monthly Net Burn", page: 1, status: present, note: "shown as ($0.75M), an outflow; excludes non-cash SBC of $0.38M"}
    ebitda:                  {status: null_in_source}
    headcount:               {value: 142,  label_as_reported: "Total Headcount", page: 1, status: present}

