[project]
name = "portfolio-extract"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pdfplumber>=0.11", "pydantic>=2.7", "instructor>=1.5", "openai>=1.40", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
portfolio-extract = "portfolio_extract.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: requires a live LLM API key (deselect with -m 'not llm')"]
